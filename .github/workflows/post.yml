name: 인스타 예약 게시
on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 확인 (GitHub 사정으로 늦을 수 있음)
    - cron: "*/10 3-4 * * *"     # 한국 12:00~13:59 (점심 게시 시간대) 10분마다
    - cron: "*/10 11-13 * * *"   # 한국 20:00~22:59 (저녁 게시 시간대) 10분마다
  push:
    paths: ["schedule.json", "render/**"]   # 일정·카드 문구가 바뀌면 바로 카드 렌더
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1이면 실제 게시 없이 확인만"
        default: "0"
      check:
        description: "1이면 게시 없이 토큰·이미지 연결만 점검"
        default: "0"
permissions:
  contents: write
concurrency: ig-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 카드 렌더 필요한지 확인
        id: need
        run: python3 render/render.py --check
      - name: 렌더 도구 설치 (한글 폰트 + playwright)
        if: steps.need.outputs.need == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q playwright
      - name: 카드 렌더
        if: steps.need.outputs.need == '1'
        run: python3 render/render.py
      - name: 렌더한 카드 저장
        if: steps.need.outputs.need == '1'
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add cards
          git diff --cached --quiet || (git commit -m "카드 렌더" && git pull --rebase && git push)
      - name: 게시
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/cards/
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          CHECK: ${{ github.event.inputs.check || '0' }}
        run: python3 post.py
      - name: 게시 기록 저장
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "게시 기록" && git pull --rebase && git push)
