name: 인스타 예약 게시
on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 확인 (GitHub 사정으로 몇 분~수십 분 늦을 수 있음)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1이면 실제 게시 없이 확인만"
        default: "0"
permissions:
  contents: write
concurrency: ig-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 게시
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/cards/
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python3 post.py
      - name: 게시 기록 저장
        run: |
          git config user.name "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "게시 기록" && git push)
